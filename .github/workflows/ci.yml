name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build
        env:
          SKIP_ENV_VALIDATION: 'true'
      - run: npm audit --omit=dev --audit-level=high
      # Lint is advisory until the existing errors are burned down (item 7.1).
      - run: npx eslint || true
